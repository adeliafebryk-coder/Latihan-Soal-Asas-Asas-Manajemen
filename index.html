<style>
:root{--bg:#F2F4F9;--card:#fff;--ink:#1B2340;--mute:#5E6684;--line:#DDE1EE;--acc:#3D4FD6;--accT:#fff;--ok:#1F8F5F;--okBg:#DDF3E8;--bad:#D6404E;--badBg:#FBE0E3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12162A;--card:#1C2140;--ink:#E8EBFA;--mute:#9AA1C4;--line:#2D345C;--acc:#8A97FF;--accT:#12162A;--ok:#5FD39A;--okBg:#173A2E;--bad:#FF7C88;--badBg:#43202A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12162A;--card:#1C2140;--ink:#E8EBFA;--mute:#9AA1C4;--line:#2D345C;--acc:#8A97FF;--accT:#12162A;--ok:#5FD39A;--okBg:#173A2E;--bad:#FF7C88;--badBg:#43202A;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
main{max-width:680px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:26px;font-weight:800;margin:4px 0 2px}
h2{font-size:18px;margin:22px 0 8px}
p.sub{color:var(--mute);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--acc);color:var(--accT);border-color:var(--acc)}
.chip small{opacity:.75;margin-left:4px}
.btn{font:inherit;font-weight:600;border:0;border-radius:12px;padding:13px 18px;background:var(--acc);color:var(--accT);cursor:pointer;width:100%;font-size:16px}
.btn.ghost{background:transparent;color:var(--acc);border:1.5px solid var(--acc)}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:8px;margin-top:10px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:8px;cursor:pointer}
.opt b{min-width:22px;color:var(--acc)}
.opt.ok{background:var(--okBg);border-color:var(--ok)}
.opt.bad{background:var(--badBg);border-color:var(--bad)}
.opt.ok b{color:var(--ok)}.opt.bad b{color:var(--bad)}
.opt:focus-visible,.chip:focus-visible,.btn:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.badge{display:inline-block;font-size:13px;font-weight:600;color:var(--acc);border:1.5px solid var(--acc);border-radius:8px;padding:2px 9px;margin-bottom:10px}
.top{display:flex;justify-content:space-between;font-size:14px;color:var(--mute);margin-bottom:8px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--acc);transition:width .25s}
.q{font-size:17px;font-weight:600;margin:0}
.fb{margin-top:10px;font-weight:600}
.big{font-size:56px;font-weight:800;line-height:1;margin:6px 0}
.stat{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.stat:last-child{border:0}
.wrongItem{padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.wrongItem:last-child{border:0}
.hide{display:none}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<main id="app"></main>
<script>
/* ====== BANK SOAL: tambah soal baru di sini ======
 m = modul, tf = tes formatif, o = pilihan A-D, k = indeks kunci (0=A,1=B,2=C,3=D) */
const BANK = {
 "ISIP411103": { nama: "Asas-asas Manajemen", soal: [
  {m:1,tf:1,q:"Definisi manajemen yang menyatakan bahwa \u201Cmanagement is a distinct process consisting of planning, organizing, actuating, and controlling, performed to determine and accomplish stated objective by the use of human beings and other resources\u201D, diungkapkan oleh \u2026.",o:["Terry","Daft","Dale","Gulick"],k:0},
  {m:1,tf:1,q:"Untuk mencapai tujuan organisasi diperlukan sumber daya inti yang dinyatakan oleh Terry (1977:3). Salah satu sumber daya inti yang merupakan unsur terpenting dalam organisasi dan merupakan roh bagi berjalannya organisasi adalah \u2026.",o:["machines","materials","money","man and women"],k:3},
  {m:1,tf:1,q:"Bagaimana manajemen menciptakan, melaksanakan dan mengarahkan tujuan organisasi melalui kerja sama berbagai upaya manusia secara sistematis dan terkoordinasi adalah fungsi manajemen sebagai \u2026.",o:["ilmu","seni","proses","cara"],k:2},
  {m:1,tf:1,q:"Dalam sebuah organisasi, manusia bekerja dengan sumber daya non manusia seperti mesin-mesin, bahan, aset keuangan, dan bangunan. Manajemen mengintegrasikan semua sumber daya itu. Hal ini dilakukan dengan cara menciptakan situasi harmonis diantara sumber daya manusia, fisik dan sumber daya keuangan. Pernyataan tersebut adalah aspek manajemen sebagai \u2026.",o:["proses sosial","proses yang terintegrasi","proses terus menerus","kegiatan bersama"],k:1},
  {m:1,tf:1,q:"Penempatan manajemen fungsional maupun manajemen umum tidak tergantung pada posisi dalam jenjang organisasi, tetapi pada lingkup \u2026.",o:["perencanaannya","kegiatannya","jabatannya","wewenangnya"],k:1,e:"Manajer fungsional atau umum dibedakan dari lingkup kegiatannya, bukan jabatannya. Contoh: Direktur Keuangan = manajer fungsional (satu jenis kegiatan), Direktur Utama = manajer umum."},
  {m:1,tf:2,q:"Salah satu alasan mempelajari sejarah perkembangan pemikiran manajemen adalah untuk memberikan pemahaman tentang proses perubahan (metamorfosis) manajemen sejak awal sampai dengan perkembangannya saat ini. Dengan mempelajari teori-teori pemikiran akan diperoleh hal-hal sebagai berikut \u2026.",o:["Teori adalah perspektif, dengan teori maka hal tersebut akan “mencerap” pada pikiran atas dasar pengalaman.","Teori memberikan fokus yang stabil untuk memahami atas apa yang kita alami.","Teori memberikan kemampuan kepada kita untuk mengkomunikasikan secara efektif dan dengan demikian mengubah ke suatu hubungan yang lebih sederhana dengan orang lain.","Teori memberikan kemungkinan sebagai sarana untuk “menangkap” materi pembelajaran tentang segala hal."],k:1},
  {m:1,tf:2,q:"Teori klasik mulai berkembang sekitar tahun 1900 dan berlanjut sampai dengan tahun 1930-an. Penyumbang utama pemikiran teori klasik adalah F.W. Taylor. Teori klasik mengkhususkan pada pencapaian \u2026.",o:["tujuan","efisiensi dan produktivitas","nilai perusahaan","kesejahteraan"],k:1},
  {m:1,tf:2,q:"Mary Parker Follett dan Chester Barnard adalah dua pendukung awal dari \u2026.",o:["pendekatan ilmu perilaku (behavioral sciences approach)","perspektif sains manajemen (management science perspective)","perspektif Sumber Daya Manusia (human resources perspective)","perspektif yang lebih humanistik (humanistic perspective)"],k:3,e:"Follett dan Barnard menekankan perilaku, kebutuhan, dan sikap manusia di tempat kerja, serta interaksi sosial dan proses kelompok."},
  {m:1,tf:2,q:"Perspektif humanistik masih paling mendominasi dari tahun 1950-an hingga sekarang. Daft (2010:61) mengemukakan tiga konsep baru yang berkembang adalah teori sistem, pandangan kontingensi, dan manajemen kualitas total (total quality management – TQM). Dasar pemikiran salah satu teori di atas menganggap bahwa tidak ada sesuatu yang eksis dalam keadaan vakum. Setiap bagian dalam organisasi atau perusahaan saling mempengaruhi satu sama lain. Selanjutnya setiap organisasi atau perusahaan eksis dalam suatu sistem, dan setiap sistem eksis dalam sistem yang lebih besar. Teori yang dimaksud adalah \u2026.",o:["Teori Sistem","Teori pandangan Kontingensi","Teori Manajemen Kualitas Total","Teori Perilaku"],k:0,e:"Ciri khas teori sistem: semua bagian saling mempengaruhi, dan tiap sistem berada di dalam sistem yang lebih besar."},
  {m:1,tf:2,q:"Pembahasan mengenai kualitas adalah konsep lain yang termasuk ke dalam pemikiran manajemen. Gerakan kualitas erat kaitannya dengan perusahaan-perusahaan di negara \u2026.",o:["Amerika","Jerman","Korea","Jepang"],k:3,e:"Pemikiran W. Edward Deming awalnya kurang diperhatikan di Amerika, tetapi diadopsi dan dimodifikasi oleh Jepang untuk membangun kembali industrinya."},
  {m:1,tf:"LT",q:"Tokoh yang dikenal sebagai bapak manajemen ilmiah adalah \u2026.",o:["Frederick W. Taylor","Henry Fayol","Max Weber","Elton Mayo"],k:0,e:"Taylor memperkenalkan manajemen ilmiah dalam perspektif klasik."},
  {m:1,tf:"LT",q:"Frank dan Lilian Gilbreth termasuk tokoh dalam kajian \u2026.",o:["manajemen ilmiah","gerakan hubungan manusia","teori sistem","manajemen kualitas total"],k:0,e:"Menurut rangkuman, selain Taylor ada juga Frank dan Lilian Gilbreth di kajian manajemen ilmiah."},
  {m:1,tf:"LT",q:"Tokoh organisasi birokratis dalam perspektif klasik adalah \u2026.",o:["Henry Fayol","Max Weber","Abraham Maslow","Douglas McGregor"],k:1},
  {m:1,tf:"LT",q:"Kajian prinsip administrasi dalam perspektif klasik dikaitkan dengan tokoh \u2026.",o:["Frederick W. Taylor","Max Weber","Henry Fayol","Elton Mayo"],k:2},
  {m:1,tf:"LT",q:"Studi Hawthorne dalam kajian gerakan hubungan manusia dipelopori oleh \u2026.",o:["Elton Mayo","Henry Fayol","Chester Barnard","Frank Gilbreth"],k:0},
  {m:1,tf:"LT",q:"Teori Hierarki Kebutuhan dalam kajian sumber daya manusia dikemukakan oleh \u2026.",o:["Douglas McGregor","Abraham Maslow","Elton Mayo","Max Weber"],k:1},
  {m:1,tf:"LT",q:"Teori X dan Teori Y dikemukakan oleh \u2026.",o:["Abraham Maslow","Elton Mayo","Douglas McGregor","W. Edward Deming"],k:2},
  {m:1,tf:"LT",q:"Perspektif yang menerapkan berbagai teknik kuantitatif untuk memecahkan masalah manajerial adalah perspektif \u2026.",o:["klasik","humanistik","teori sistem","ilmu manajemen"],k:3,e:"Perspektif ketiga dalam rangkuman adalah ilmu manajemen, yang memakai teknik kuantitatif."},
  {m:1,tf:"LT",q:"Berikut ini konsep baru yang muncul setelah Perang Dunia II, kecuali \u2026.",o:["teori sistem","teori kontingensi","TQM","manajemen ilmiah"],k:3,e:"Manajemen ilmiah berasal dari perspektif klasik (sekitar 1900-an), jauh sebelum Perang Dunia II."},
  {m:1,tf:"LT",q:"W. Edward Deming dikenal sebagai bapak \u2026.",o:["manajemen ilmiah","gerakan kualitas","gerakan hubungan manusia","teori sistem"],k:1},
  {m:2,tf:1,q:"Berbagai faktor seperti nilai-nilai sosial (social values), taraf pendidikan (educational), politik, ekonomi, hukum, demografi, lingkungan, sumber daya alam, dan teknologi adalah termasuk pada lingkungan \u2026.",o:["tugas","khusus","umum","internal"],k:2,e:"Lingkungan umum adalah lapisan terluar yang tersebar luas dan terdiri dari berbagai faktor yang relatif tidak dapat dikendalikan oleh perusahaan."},
  {m:2,tf:1,q:"Daft (2010: 84) menyatakan dimensi-dimensi lingkungan umum mencakup dimensi \u2026.",o:["hukum-politik, teknologi dan alam","sosial budaya, hukum-politik, dan alam","internasional, teknologi, dan sosial budaya","internasional, teknologi, sosial budaya, hukum-politik, dan alam"],k:3,e:"Lima dimensi lingkungan umum menurut Daft: internasional, teknologi, sosial budaya, hukum-politik, dan alam."},
  {m:2,tf:1,q:"Perubahan paling dramatis di lingkungan internasional selama beberapa tahun terakhir adalah peralihan kekuatan ekonomi kepada \u2026.",o:["Cina dan India","Cina dan Jepang","India","Korea"],k:0,e:"Keduanya punya populasi, pemikiran, dan kedinamisan untuk mengubah ekonomi global abad dua puluh satu."},
  {m:2,tf:1,q:"Seperti yang sudah digambarkan sebelumnya, lingkungan tugas terdiri atas sektor-sektor yang memiliki hubungan kerja langsung dengan organisasi, yaitu \u2026.",o:["pelanggan, pesaing, pemasok, dan pasar tenaga kerja","pelanggan, pesaing, pemasok","pesaing, pemasok, dan pasar tenaga kerja","pelanggan, pemasok, dan pasar tenaga kerja"],k:0,e:"Empat sektor lingkungan tugas: pelanggan, pesaing, pemasok, dan pasar tenaga kerja."},
  {m:2,tf:1,q:"Tidak jauh berbeda dengan dimensi-dimensi atau elemen-elemen organisasi, Lubis & Husaini mengemukakan bahwa lingkungan sebuah organisasi (perusahaan Industri) terdiri dari bermacam-macam segmen, di antaranya adalah \u2026.",o:["kondisi ekonomi, pemerintah, politik industri, bahan baku, kondisi ekonomi","industri, bahan baku, daya saing","industri, bahan baku, kondisi ekonomi","kebudayaan, politik, teknologi"],k:2,e:"Segmen menurut Lubis & Husaini: industri, bahan baku, tenaga kerja, keuangan, pasar, teknologi, kondisi ekonomi, pemerintah, dan kebudayaan."},
  {m:2,tf:2,q:"Organisasi harus berusaha membuat ketidakpastian lingkungan jadi efektif. Ketidakpastian lingkungan disini berarti \u2026.",o:["bahwa manajer tidak mempunyai informasi yang cukup mengenai faktor-faktor lingkungan untuk dapat memahami dan memperkirakan kebutuhan dan perubahan lingkungan","bahwa manajer tidak mempunyai informasi yang cukup mengenai dimensi-dimensi lingkungan untuk dapat memahami dan memperkirakan kebutuhan dan perubahan lingkungan","bahwa manajer tidak mempunyai informasi yang cukup mengenai elemen-elemen lingkungan untuk dapat memahami dan memperkirakan kebutuhan dan perubahan lingkungan","bahwa manajer tidak mempunyai informasi yang cukup mengenai segmen-segmen lingkungan untuk dapat memahami dan memperkirakan kebutuhan dan perubahan lingkungan"],k:0,e:"Perhatikan kata kuncinya: faktor-faktor lingkungan. Pilihan lain memakai kata dimensi, elemen, atau segmen."},
  {m:2,tf:2,q:"Strategi pengelolaan lingkungan yang memungkinkan pimpinan mengetahui perubahan-perubahan terlebih dahulu dan dapat membuat penyesuaian internal daripada bereaksi sesudah ada kejadian. Strategi yang dimaksud yaitu \u2026.",o:["pemilihan domain","pengamatan lingkungan","rekrutmen","smoothing"],k:1,e:"Pengamatan lingkungan memakai unit boundary spanners (misalnya sales representative, peneliti pemasaran, agen pembelian, pelobi) sebagai agen perubahan antara organisasi dan lingkungan."},
  {m:2,tf:2,q:"Jika sebuah organisasi menghadapi ketidakpastian yang meningkat di mana berhubungan dengan persaingan, pelanggan, pemasok, atau peraturan pemerintah. Manajer dapat menggunakan beberapa strategi untuk menyesuaikan diri dengan perubahan-perubahan berikut ini, kecuali \u2026.",o:["rekanan antarorganisasi","merger atau usaha gabungan","peran-peran perluasan batas","pengamatan lingkungan"],k:3,e:"Strategi yang disebut: peran-peran perluasan batas, rekanan antarorganisasi, dan merger atau usaha gabungan. Pengamatan lingkungan tidak termasuk."},
  {m:2,tf:2,q:"Mencocokkan Ketidakpastian dengan Tindakan Strategis seperti Berintegrasi secara vertikal melalui penggabungan merupakan upaya pencocokan dengan sumber \u2026.",o:["konsumen","pemasok","pesaing","pemerintah"],k:1,e:"Menurut Tabel 2.3, berintegrasi secara vertikal melalui penggabungan adalah tindakan strategis terhadap pemasok."},
  {m:2,tf:2,q:"Strategi pengelolaan lingkungan dengan cara di mana perusahaan membajak eksekutif dari perusahaan pesaing untuk memperoleh informasi tentang rencana masa depan pesaing mereka atau menggaji mantan pejabat agar lebih gampang untuk melobi pemerintah. Strategi yang dimaksud yaitu \u2026.",o:["pemilihan domain","pengamatan lingkungan","rekrutmen","smoothing"],k:2,e:"Rekrutmen terhadap orang yang tepat dan selektif dapat mengurangi pengaruh lingkungan terhadap organisasi."},
  {m:2,tf:"LT",q:"Kata lingkungan berasal dari kata environs yang berarti \u2026.",o:["daerah sekeliling atau sekitar","sistem terbuka","unsur internal organisasi","pesaing usaha"],k:0},
  {m:2,tf:"LT",q:"Menurut para ahli, lingkungan organisasi pada dasarnya dibagi menjadi tiga macam, yaitu \u2026.",o:["lingkungan luar, lingkungan tugas, dan lingkungan dalam","lingkungan umum, sosial, dan politik","lingkungan teknologi, hukum, dan alam","lingkungan pasar, produksi, dan keuangan"],k:0},
  {m:2,tf:"LT",q:"Lingkungan internal organisasi meliputi \u2026.",o:["pelanggan dan pesaing","sumber daya dan kapabilitas","dimensi sosial budaya","pemasok dan pasar tenaga kerja"],k:1},
  {m:2,tf:"LT",q:"Berikut ini yang bukan termasuk dimensi lingkungan umum menurut Daft adalah \u2026.",o:["internasional","teknologi","hukum-politik","pelanggan"],k:3,e:"Pelanggan termasuk lingkungan tugas, bukan lingkungan umum."},
  {m:2,tf:"LT",q:"Sebagai sebuah sistem terbuka, perusahaan memperoleh sumber daya dan menghasilkan barang dan jasa dari dan ke \u2026.",o:["lingkungan eksternal","lingkungan internal","lingkungan tugas saja","lingkungan khusus saja"],k:0},
  {m:2,tf:"LT",q:"Analisis lingkungan dimulai dari hal yang paling sederhana, yaitu \u2026.",o:["menyusun strategi merger","memahami unsur-unsur dalam lingkungan umum dan lingkungan khusus organisasi","merekrut eksekutif pesaing","menentukan domain usaha"],k:1},
  {m:2,tf:"LT",q:"Merger dan joint venture termasuk cara mengelola ketidakpastian lingkungan yang bersifat \u2026.",o:["kemitraan","pengamatan","perekrutan","pelobian"],k:0},
  {m:2,tf:"LT",q:"Sales representative, peneliti pemasaran, agen pembelian, dan pelobi berfungsi sebagai \u2026.",o:["unit produksi","boundary spanners","pemasok utama","pesaing"],k:1,e:"Boundary spanners adalah agen perubahan antara organisasi dengan lingkungannya."},
  {m:2,tf:"LT",q:"Strategi lobbying dan smoothing termasuk cara pimpinan organisasi untuk \u2026.",o:["mengelola ketidakpastian lingkungan","menyusun anggaran","menilai kinerja karyawan","mengganti struktur organisasi"],k:0},
  {m:2,tf:"LT",q:"Ketidakpastian lingkungan berarti bahwa manajer \u2026.",o:["tidak mempunyai informasi yang cukup untuk memahami dan memperkirakan kebutuhan dan perubahan lingkungan","tidak perlu mengamati lingkungan","yakin semua perubahan bisa dikendalikan","hanya menghadapi pesaing"],k:0},
  {m:3,tf:1,q:"Salah satu ahli menyebutkan bahwa manajemen sebagai fungsi-fungsi manajer yang terdiri dari planning, organizing, staffing, leading, controlling dan diakhiri dengan coordination sebagai esensi managership, karena semua fungsi tersebut harus terkoordinasikan adalah \u2026.",o:["Weichrich dan Koontz","George Robert Terry","Henri Fayol","Henry Mintzberg"],k:0,e:"Weichrich dan Koontz (1993): planning, organizing, staffing, leading, controlling, dengan coordination sebagai esensi managership."},
  {m:3,tf:1,q:"Prinsip fungsi manajemen yang merupakan suatu prosedur untuk menjamin bahwa capaian-capaian tujuan organisasi telah dilalui dengan memuaskan dan sesuai dengan rencana-rencana adalah prinsip \u2026.",o:["perencanaan","pengorganisasian","penggerakan atau pengarahan","pengawasan dan pengendalian"],k:3,e:"Pengawasan adalah prosedur untuk menjamin capaian tujuan sesuai rencana. Catatan pengalaman yang rinci juga penting."},
  {m:3,tf:1,q:"Prinsip fungsi manajemen yang merupakan suatu tugas yang kompleks di mana di dalamnya terlibat pegawai atau anggota organisasi dari berbagai bagian atau unit yang berbeda adalah prinsip \u2026.",o:["perencanaan","pengorganisasian","penggerakan atau pengarahan","pengawasan dan pengendalian"],k:2,e:"Penggerakan/pengarahan: tugas kompleks yang melibatkan anggota dari berbagai bagian atau unit."},
  {m:3,tf:1,q:"Salah satu ahli yang menetapkan bahwa ada lima fungsi atau elemen manajemen yaitu: planning, organizing, commanding, coordinating, dan controlling, adalah \u2026.",o:["Weichrich dan Koontz","George Robert Terry","Henri Fayol","Henry Mintzberg"],k:2,e:"Fayol: fungsi-fungsi ini bersifat universal, berlaku di bisnis, militer, pemerintahan, dan lembaga lain."},
  {m:3,tf:1,q:"Salah satu kritikus terhadap teori fungsi manajemen Henri Fayol menyampaikan alasannya bahwa fungsi atau proses manajemen adalah “folklore” dan fungsi-fungsi manajemen seperti perencanaan, pengorganisasian, kepemimpinan dan pengawasan atau pengendalian, tidak secara akurat menggambarkan kompleksitas atau kesemrawutan tugas-tugas manajerial. Minzberg merasa bahwa pendekatan fungsional atas pekerjaan manajerial adalah “kebohongan secara sadar” bahwa manajer secara hati-hati dan sengaja mengevaluasi informasi sebelum membuat keputusan. Kritikus yang dimaksud adalah \u2026.",o:["Weichrich dan Koontz","George Robert Terry","Henri Fayol","Henry Mintzberg"],k:3,e:"Mintzberg mengkritik pendekatan fungsional dan menyebut proses manajemen sebagai folklore."},
  {m:3,tf:2,q:"Salah satu ahli memberikan definisi pengorganisasian “adalah tindakan mengusahakan hubungan kelakuan yang efektif antara orang-orang, hingga mereka dapat bekerja sama secara efisien dan demikian memperoleh kepuasan pribadi dalam hal melaksanakan tugas tertentu dalam kondisi lingkungan tertentu guna mencapai tujuan atau sasaran tertentu.” Yaitu \u2026.",o:["Weichrich dan Koontz","George Robert Terry","Henri Fayol","Henry Mintzberg"],k:0,e:"Kunci di buku: A. Catatan: teks pembahasan di kunci buku menyebut Terry (pilihan B), jadi ada kemungkinan salah cetak. Cek ke tutor kalau ragu."},
  {m:3,tf:2,q:"Fayol mengemukakan tiga sudut pandang tentang kontrol. Salah satu sudut pandang menyatakan bahwa kontrol harus menjamin bahwa perencanaan berjalan secara nyata, bahwa perencanaan sudah diuraikan pada kegiatan dan tetap dijaga agar selalu sesuai (up to date), bahwa pengorganisasian orang-orang sudah lengkap, peta dan penempatan personal sudah pada tempatnya (in use), dan bahwa perintah sudah dilaksanakan sejalan dengan prinsip-prinsip, bahwa pertemuan koordinasi sudah dilakukan. Sudut pandang yang dimaksud adalah \u2026.",o:["sudut pandang komersial","sudut pandang pengelola","sudut pandang teknis","sudut pandang organisasi"],k:1,e:"Tiga sudut pandang kontrol menurut Fayol: pengelola, komersial, dan teknis. Yang ini menyangkut perencanaan, organisasi, perintah, dan koordinasi, yaitu sudut pandang pengelola."},
  {m:3,tf:2,q:"Staffing George Robert Terry dan Leslie W. Rue adalah \u2026.",o:["menentukan keperluan sumber daya manusia, pengarahan, penyaringan, latihan dan pengembangan tenaga kerja serta penyesuaian kualitas dan kuantitas sesuai dengan tuntutan perubahan dan kondisi","memasok orang untuk menjalankan rencana dan sistem organisasi","penyusunan personalia pada suatu organisasi sejak dari merekrut tenaga kerja, pengembangannya sampai dengan usaha agar setiap tenaga memberi daya guna maksimal kepada organisasi","pengisian posisi-posisi dalam struktur organisasi"],k:0},
  {m:3,tf:2,q:"Perencanaan menurut Robbins dan Coulter pada dasarnya adalah \u2026.",o:["proses yang menyangkut upaya yang dilakukan untuk mengantisipasi kecenderungan di masa yang akan datang dan penentuan strategi dan taktik yang tepat untuk mewujudkan target dan tujuan organisasi","penentuan langkah-langkah yang memungkinkan organisasi mencapai tujuan-tujuannya","membuat keputusan tentang tujuan-tujuan yang ingin dicapai dimulai dengan definisi sasaran yang ingin dicapai","sebagai dasar pemikiran dari tujuan dan penyusunan langkah-langkah yang akan dipakai untuk mencapai tujuan"],k:2},
  {m:3,tf:2,q:"Salah satu karakteristik perencanaan yaitu adanya periode perencanaan, di mana variasinya sangat tergantung kepada jenis organisasi/perusahaan, industri, siklus produksi dan lain-lain. Pernyataan tersebut disampaikan oleh \u2026.",o:["Heinz Weichrich dan Harold Koontz","Robert Terry dan Leslie W. Rue","George, Thomas S. Bateman dan Scott A. Snell","Haimann dan Scott"],k:3,e:"Haimann dan Scott menyebut tujuh karakteristik perencanaan. Yang ini adalah karakteristik ke-2: adanya periode perencanaan."},
  {m:3,tf:"LT",q:"Terry mengelompokkan dan membedakan fungsi manajemen dalam empat fungsi pokok yang disingkat POAC, yaitu \u2026.",o:["Planning, Organizing, Actuating, Controlling","Planning, Organizing, Assigning, Coordinating","Planning, Operating, Actuating, Commanding","Preparing, Organizing, Acting, Controlling"],k:0},
  {m:3,tf:"LT",q:"Actuating dalam fungsi manajemen menurut Terry berarti \u2026.",o:["perencanaan","pengorganisasian","penggerakan","pengawasan"],k:2},
  {m:3,tf:"LT",q:"Pada dasarnya fungsi adalah bentuk penyederhanaan (pemodelan) yang berasal dari \u2026.",o:["dunia nyata atau dunia ide yang rumit","hasil penelitian laboratorium","aturan pemerintah","struktur organisasi"],k:0,e:"Penyederhanaan membuat hal yang rumit lebih mudah dipahami, lalu diringkas menjadi satu fungsi."},
  {m:3,tf:"LT",q:"Menurut aliran proses manajemen, seluruh pimpinan atau manajer, terlepas apakah berada di industri atau organisasi mana pun, \u2026.",o:["hanya menjalankan fungsi pengawasan","melaksanakan fungsi-fungsi manajemen","tidak perlu merencanakan","hanya memberi perintah"],k:1},
  {m:3,tf:"LT",q:"Fungsi-fungsi manajemen menjadi cara yang paling umum untuk menguraikan \u2026.",o:["sifat-sifat pekerjaan manajerial","jenis-jenis produk","kondisi pasar","struktur keuangan"],k:0},
  {m:3,tf:"LT",q:"Sepuluh peran pimpinan menurut Mintzberg dibagi dalam tiga kelompok, yaitu \u2026.",o:["interpersonal role, information role process, dan decision role","planning role, controlling role, dan leading role","technical role, human role, dan conceptual role","social role, economic role, dan political role"],k:0},
  {m:3,tf:"LT",q:"Fungsi manajemen yang dianggap fungsi standar oleh para ahli adalah \u2026.",o:["perencanaan dan pengawasan/pengendalian","penggerakan dan pengarahan","staffing dan koordinasi","komunikasi dan motivasi"],k:0},
  {m:3,tf:"LT",q:"Semua ahli manajemen selalu menempatkan fungsi \u2026 sebagai fungsi pertama.",o:["pengorganisasian","perencanaan","pengawasan","penggerakan"],k:1,e:"Urutan: perencanaan pertama, pengorganisasian kedua, pengawasan/pengendalian terakhir."},
  {m:3,tf:"LT",q:"Organisasi yang mekanistik cenderung \u2026.",o:["longgar dan informal","ketat, formal, dan birokratis","tanpa struktur","tanpa pengawasan"],k:1,e:"Organisasi organik justru cenderung longgar."},
  {m:4,tf:1,q:"Perencanaan pada intinya adalah merencanakan suatu keberhasilan di masa mendatang. Oleh karenanya perencanaan akan memacu organisasi untuk lebih berhasil dan mendukung pencapaian posisi yang lebih baik dibanding organisasi lain. Peluang tercapainya tujuan organisasi menjadi lebih besar dengan perencanaan yang sesuai \u2026.",o:["perencanaan sebagai indikasi posisi organisasi","perencanaan sebagai indikasi kemajuan organisasi","perencanaan sebagai keputusan","integrasi"],k:0},
  {m:4,tf:1,q:"Macam-macam perencanaan dapat dilihat pada kriteria-kriteria yaitu \u2026.",o:["jangka waktu, ruang lingkup, tingkat keluwesan dan arus informasi","rencana strategis, rencana operasional dan rencana kontingensi","kontribusi terhadap organisasi, logis dan asumtif","limitatif dan komitmen; koordinatif, timing"],k:0,e:"Empat kriteria: jangka waktu, ruang lingkup, tingkat keluwesan, dan arus informasi."},
  {m:4,tf:1,q:"Berdasarkan ruang lingkupnya, perencanaan dapat dibagi dalam \u2026.",o:["perencanaan jangka panjang, perencanaan jangka menengah, perencanaan jangka pendek","preskriptif dan indikatif","perencanaan agregatif-komprehensif, perencanaan parsial dan perencanaan terpadu","perencanaan top down dan perencanaan bottom up"],k:2,e:"Jangka waktu = panjang/menengah/pendek. Keluwesan = preskriptif dan indikatif. Arus informasi = top down dan bottom up."},
  {m:4,tf:1,q:"Sebuah kegiatan yang bersifat sementara yang telah ditetapkan awal pekerjaannya dan waktu selesainya (dan biasanya selalu dibatasi oleh waktu, dan seringkali juga dibatasi oleh sumber pendanaan), untuk mencapai tujuan dan hasil yang spesifik dan unik atau menghasilkan sebuah tertentu adalah pengertian dari \u2026.",o:["program","anggaran","proyek","rencana"],k:2},
  {m:4,tf:1,q:"Ada beberapa ciri yang menunjukkan suatu perencanaan yang baik, sebagaimana dikemukakan oleh Soekarno K (1985) yaitu harus bersifat \u2026.",o:["rasional, baku dan terarah","rasional, lentur, dan berkelanjutan","logis dan asumtif","sederhana"],k:1},
  {m:4,tf:2,q:"Strategi ini adalah strategi penyerangan secara total atau masal di mana perencanaan yang telah disusun dapat dilaksanakan secepat mungkin dengan menggempur semua titik-titik utama yaitu kelompok-kelompok yang ada dalam organisasi. Strategi ini harus menggunakan secara efektif otoritas yang dimiliki sehingga tidak ada alasan menolak atau mengelak dari kelompok-kelompok resisten, kecuali menaati dan melaksanakannya. Strategi yang dimaksud adalah \u2026.",o:["lempar tanggung jawab","camel head in the tent","alihkan perhatian (confuse the issue)","mass concentrated offensive atau earthquake approach"],k:3},
  {m:4,tf:2,q:"Strategi ini menggunakan cara-cara infiltrasi atau penyusupan. Jika sebuah rencana disampaikan secara sekaligus, besar kemungkinan rencana akan ditolak atau terjadi resistensi. Strategi yang dimaksud adalah \u2026.",o:["lempar tanggung jawab","camel head in the tent","alihkan perhatian (confuse the issue)","mass concentrated offensive atau earthquake approach"],k:1,e:"Camel head in the tent: rencana ditawarkan bertahap bagian demi bagian agar lebih mudah diterima."},
  {m:4,tf:2,q:"Untuk menyusun rencana yang baik, Stoner mengemukakan empat langkah pokok yang penerapannya dapat disesuaikan dengan semua kegiatan pada semua tingkat organisasi. Salah satu langkah pokok tersebut yaitu Perencanaan dimulai dengan keputusan-keputusan tentang apa yang diinginkan atau yang dibutuhkan oleh suatu organisasi. Langkah pokok tersebut yaitu \u2026.",o:["tetapkan suatu sasaran atau perangkat sasaran","identifikasi faktor pendukung dan penghambat sasaran","kembangkan suatu rencana atau tindakan untuk mencapai sasaran","definisikan situasi saat ini"],k:0,e:"Empat langkah Stoner: (1) tetapkan sasaran, (2) definisikan situasi saat ini, (3) identifikasi faktor pendukung dan penghambat, (4) kembangkan rencana."},
  {m:4,tf:2,q:"Dalam organisasi rencana mempunyai dua fungsi. Salah satunya adalah \u2026.",o:["sebagai sarana untuk mencapai tujuan yang telah ditetapkan","sebagai sarana untuk meningkatkan kinerja dan produktivitas","menjadi atau sebagai kerangka bagi rencana dan bagi tindakan-tindakan operasional untuk menghasilkan sesuatu yang nyata pada tingkat berikutnya yang lebih rendah","menjadi atau sebagai kerangka bagi rencana dan bagi tindakan-tindakan operasional untuk menghasilkan sesuatu yang nyata pada tingkat berikutnya yang lebih tinggi"],k:2,e:"Dua fungsi rencana: (1) sarana mencapai tujuan yang ditetapkan pada perencanaan tingkat lebih tinggi, (2) kerangka bagi rencana dan tindakan operasional pada tingkat berikutnya yang lebih rendah. Perhatikan: pilihan C bertuliskan lebih rendah, pilihan D lebih tinggi."},
  {m:4,tf:2,q:"Ketika pilihan sudah dibuat dalam bentuk rencana yang sudah ditetapkan, maka langkah selanjutnya adalah \u2026.",o:["mengonversi rencana ke dalam anggaran","memilih dan melaksanakan (tindakan)","merumuskan derivasi (turunan) rencana","mengevaluasi alternatif"],k:0,e:"Langkah numberizing: mengonversi rencana ke dalam angka-angka anggaran."},
  {m:4,tf:"LT",q:"Menurut Koontz dan Weichrich, perencanaan melibatkan pemilihan \u2026.",o:["misi, tujuan organisasi, dan tindakan untuk mencapainya","struktur dan jabatan organisasi","karyawan dan gaji","produk dan pasar"],k:0,e:"Hal ini membutuhkan pengambilan keputusan, yaitu memilih di antara berbagai alternatif cara tindakan."},
  {m:4,tf:"LT",q:"Rencana kontingensi dibuat untuk \u2026.",o:["menggantikan rencana strategis","mengantisipasi apabila ketiga tipe rencana lain gagal karena faktor internal maupun eksternal","menentukan anggaran tahunan","mempercepat proses rekrutmen"],k:1},
  {m:4,tf:"LT",q:"Menurut Stoner, langkah kedua dalam menyusun rencana yang baik adalah \u2026.",o:["tetapkan sasaran","definisikan situasi saat ini","identifikasi faktor pendukung dan penghambat sasaran","kembangkan rencana"],k:1},
  {m:4,tf:"LT",q:"Menurut Stoner, langkah ketiga dalam menyusun rencana yang baik adalah \u2026.",o:["identifikasi faktor pendukung dan penghambat sasaran","tetapkan sasaran","definisikan situasi saat ini","kembangkan rencana atau tindakan untuk mencapai sasaran"],k:0},
  {m:4,tf:"LT",q:"Langkah terakhir dari empat langkah pokok menyusun rencana menurut Stoner adalah \u2026.",o:["tetapkan sasaran","definisikan situasi saat ini","identifikasi faktor pendukung dan penghambat","kembangkan suatu rencana atau tindakan untuk mencapai sasaran"],k:3},
  {m:4,tf:"LT",q:"Menurut Weichrich dan Koontz (1993) terdapat tujuh langkah tahap perencanaan. Langkah pertamanya adalah \u2026.",o:["menetapkan tujuan dan sasaran","menyadari adanya kesempatan atau masalah","mengevaluasi alternatif","mengubah rencana dalam anggaran"],k:1,e:"Urutan: (a) menyadari kesempatan/masalah, (b) tetapkan tujuan dan sasaran, (c) kembangkan premis, (d) tetapkan alternatif, (e) evaluasi alternatif, (f) pilih tindakan, (g) ubah rencana dalam anggaran."},
  {m:4,tf:"LT",q:"Tahap terakhir perencanaan menurut Weichrich dan Koontz (1993) adalah \u2026.",o:["memilih atau menyeleksi tindakan","mengevaluasi alternatif","mengubah rencana dalam anggaran","mengembangkan premis atau asumsi perencanaan"],k:2},
  {m:4,tf:"LT",q:"Strategi agar perencanaan diterima pemangku kepentingan: Tempa baja selagi panas, dalam bahasa Inggris adalah \u2026.",o:["strike while the iron is hot","two heads are better than one","camel head in the tent","sowing seed on the fertile ground"],k:0},
  {m:4,tf:"LT",q:"Strategi camel head in the tent dilakukan dengan cara \u2026.",o:["penyerangan total secara massal","infiltrasi atau penyusupan, rencana ditawarkan bertahap","melemparkan tanggung jawab","mengalihkan perhatian"],k:1},
  {m:4,tf:"LT",q:"Mass concentrated offensive dikenal juga dengan sebutan \u2026.",o:["earthquake approach","confuse the issue","divide et impera","camel head approach"],k:0},
  {m:5,tf:1,q:"“Organisation is the process of identifying and grouping of the works to be performed, defining and delegating responsibility and authority and establishing relationships for the purpose of enabling people to work efficiently”. Pengertian tersebut dikemukakan oleh \u2026.",o:["Daft","Adam Smith","Louis A. Allen","Alfred Chandler"],k:2},
  {m:5,tf:1,q:"Di bawah ini adalah salah satu faktor yang bisa mempengaruhi penetapan pengorganisasian yaitu \u2026.",o:["ukuran Organisasi","kejelasan Peran","pembagian kerja","departementasi"],k:0,e:"Enam faktor: strategi organisasi, ukuran organisasi, kondisi lingkungan, teknologi, manusia, dan aktivitas inti."},
  {m:5,tf:1,q:"Pengorganisasian memiliki arti penting bagi organisasi. Banyak hal yang dapat memberikan manfaat bagi organisasi, apabila pengorganisasian diterapkan secara optimal. Salah satu manfaat pengorganisasian bagi organisasi yaitu \u2026.",o:["ukuran organisasi","kejelasan Peran","pembagian kerja","departementasi"],k:1,e:"Delapan arti penting: spesialisasi pekerjaan, kejelasan peran, kejelasan hubungan kerja, optimalisasi sumber daya, adaptif terhadap perubahan, koordinasi dan efektivitas, pengembangan pegawai, perluasan dan pertumbuhan organisasi."},
  {m:5,tf:1,q:"Proses pengorganisasian dilakukan dalam beberapa langkah. Salah satu langkah dalam proses pengorganisasian yaitu \u2026.",o:["ukuran organisasi","kejelasan peran","pembagian kerja","departementasi"],k:2,e:"Pembagian kerja adalah proses pertama dari pengorganisasian: identifikasi dan pemecahan pekerjaan sesuai rencana yang telah ditentukan."},
  {m:5,tf:1,q:"Berdasarkan prinsip ini, seorang bawahan bertanggung jawab hanya kepada seorang atasan sepanjang waktu. Hal ini akan membantu mencegah kurangnya komunikasi dan umpan balik dan juga akan menggiring respons yang cepat. Prinsip yang dimaksud yaitu \u2026.",o:["prinsip spesialisasi","prinsip rantai skalar","prinsip supervisi dan rentang kendali","prinsip kesatuan komando"],k:3,e:"Prinsip kesatuan komando: satu bawahan, satu atasan."},
  {m:5,tf:2,q:"Jones (2001) mengemukakan beberapa tantangan dalam mendesain organisasi, salah satunya yaitu diferensiasi-desentralisasi dan standardisasi-penyesuaian bersama (mutual adjustment) \u2026.",o:["diferensiasi-sentralisasi","diferensiasi - integrasi","diferensiasi-diferensivikasi","difersivikasi"],k:1,e:"Menurut Jones (2001), tantangan mendesain organisasi: diferensiasi-integrasi, sentralisasi-desentralisasi, dan standardisasi-penyesuaian bersama."},
  {m:5,tf:2,q:"Dalam fungsi organisasi, fungsi ini menjalankan bidang tugas memfasilitasi organisasi berkaitan dengan hubungan organisasi dengan lingkungan luar organisasi. Fungsi yang dimaksud adalah \u2026.",o:["fungsi pendukung","fungsi produksi","fungsi pemeliharaan","fungsi adaptasi"],k:0,e:"Lima fungsi organisasi (Jones, 2001): support, production, maintenance, adaptive, dan managerial function. Fungsi pendukung mencakup pembelian bahan baku, penjualan dan pemasaran, advokasi, dan hubungan masyarakat."},
  {m:5,tf:2,q:"“The process of coordinating various tasks, functions and divisions so that they work together and not at cross-purpose” (Jones). Pernyataan tersebut adalah pengertian dari \u2026.",o:["diferensiasi","integrasi","sinergi","kolaborasi"],k:1,e:"Fungsi integrasi dilakukan lewat kooperasi, koordinasi, dan komunikasi antar unit atau bagian yang terpisah."},
  {m:5,tf:2,q:"Jika diterapkan secara konsisten, maka desain organisasi yang dipilih atau dibangun akan tergambar dalam struktur organisasi. Struktur Organisasi memiliki tiga komponen, yaitu \u2026.",o:["kompleksitas, formalitas, dan sentralisasi","kompleksitas, formalitas, dan desentralisasi","kompleksitas, legalitas, dan sentralisasi","kompleksitas, legalitas, dan desentralisasi"],k:0,e:"Tiga komponen struktur organisasi: kompleksitas, formalitas, dan sentralisasi."},
  {m:5,tf:2,q:"Struktur pada umumnya digunakan pada organisasi yang menggunakan information and technology communication dan diterapkan pada organisasi dengan jumlah sumberdaya manusia yang terbatas khususnya tenaga ahli. Struktur yang dimaksud yaitu \u2026.",o:["struktur fungsional","struktur divisi","struktur matriks","struktur campuran"],k:2},
  {m:5,tf:"LT",q:"Menurut Allen, pengorganisasian adalah proses yang di dalamnya juga menetapkan keterkaitan antara pekerjaan-pekerjaan dengan tujuan agar \u2026.",o:["setiap orang dapat bekerja dengan cara paling efisien","seluruh karyawan mendapat gaji yang sama","organisasi tidak perlu direncanakan","pimpinan tidak perlu mengawasi"],k:0},
  {m:5,tf:"LT",q:"Berikut ini faktor yang berpengaruh terhadap penetapan pengorganisasian, kecuali \u2026.",o:["strategi organisasi","teknologi","aktivitas inti","spesialisasi pekerjaan"],k:3,e:"Faktor: strategi, ukuran organisasi, kondisi lingkungan, teknologi, manusia, dan aktivitas inti. Spesialisasi pekerjaan termasuk arti penting pengorganisasian."},
  {m:5,tf:"LT",q:"Berikut ini yang termasuk arti penting pengorganisasian adalah \u2026.",o:["penentuan harga produk","optimalisasi penggunaan sumber daya","penyusunan anggaran tahunan","pemilihan bahan baku"],k:1,e:"Arti penting lainnya: spesialisasi pekerjaan, kejelasan peran, kejelasan hubungan kerja, adaptif terhadap perubahan, koordinasi dan efektivitas, pengembangan pegawai, serta perluasan dan pertumbuhan organisasi."},
  {m:5,tf:"LT",q:"Akronim 5 W + H dalam hubungan perencanaan dan pengorganisasian adalah \u2026.",o:["What, Why, When, Where, Who, How","What, Which, When, Where, Whom, How","Why, Who, Where, Whose, When, How","What, Why, While, Where, Who, How"],k:0},
  {m:5,tf:"LT",q:"Desain organisasi adalah suatu model yang dipilih oleh organisasi untuk \u2026.",o:["melakukan koordinasi dan pengendalian tugas-tugas","menentukan harga jual","menghitung laba rugi","merekrut pegawai baru"],k:0},
  {m:5,tf:"LT",q:"Secara garis besar struktur organisasi dapat dibagi dalam dua jenis, yaitu \u2026.",o:["struktur fungsional dan struktur produk","struktur matriks dan struktur divisi","struktur formal dan informal","struktur tinggi dan datar"],k:0},
  {m:5,tf:"LT",q:"Struktur yang mengelompokkan orang-orang atas dasar keahlian atau pengalaman atau atas dasar penggunaan sumber daya yang sama adalah struktur \u2026.",o:["fungsional","produk","matriks","divisi"],k:0},
  {m:5,tf:"LT",q:"Struktur yang mengelompokkan orang atas dasar jenis hasil kegiatan (jasa) atau output atau jenis produksi yang dihasilkan adalah struktur \u2026.",o:["fungsional","produk","campuran","sentralisasi"],k:1},
  {m:5,tf:"LT",q:"Formalisasi yang berlebihan dalam organisasi dapat berdampak pada \u2026.",o:["meningkatnya kreativitas pegawai","terhambatnya kreativitas dan inovasi pegawai","turunnya jumlah pekerjaan","hilangnya kebijakan"],k:1,e:"Formalisasi yang tinggi bisa mengekang (stifling) kreativitas dan inovasi pegawai, sehingga organisasi lambat menanggapi masalah dan isu kritis."},
  {m:6,tf:1,q:"Definisi dari Penggerakkan adalah \u2026.",o:["suatu peran singkat-sederhana yang didasarkan atau sesuai dengan status dalam organisasi untuk melakukan tugas-tugas sosial kemasyarakatan dan acara-acara seperti peresmian, makan malam, peresmian dan bentuk perhatian lain kepada pemangku kepentingan","suatu proses untuk memotivasi orang lain agar mau melaksanakan tugas-tugas dan fungsinya","proses tindakan yang dilakukan oleh pimpinan agar sumberdaya manusia mau bekerja (melakukan action)","proses tindakan yang dilakukan oleh pimpinan agar sumberdaya manusia mau bekerja (melakukan action) sesuai dengan tugas dan tanggung jawabnya ke arah pencapaian tujuan organisasi"],k:3,e:"Pilihan A adalah peran figurehead. Pilihan C hampir benar tetapi belum menyebut tugas dan tanggung jawab serta arah pencapaian tujuan organisasi."},
  {m:6,tf:1,q:"Penggerakkan merupakan esensi paling penting dari fungsi manajemen, karena berkaitan dengan unsur \u2026.",o:["pemilihan metode yang tepat","penentuan peran pemimpin organisasi","manusia dalam organisasi","teknologi"],k:2},
  {m:6,tf:1,q:"Mintzberg (in Hampton, 1975) mengemukakan sepuluh peran pimpinan yang dibagi dalam tiga kelompok yaitu interpersonal role, information process role dan decision role. Peran liaison dengan pihak eksternal organisasi dengan cara membangun jejaring, termasuk dengan mitra perusahaan, media masa dan corporate social responsibility disebut \u2026.",o:["interpersonal role","information role process","decision role","figurehead role"],k:0,e:"Peran interpersonal terdiri dari figurehead, leader, dan liaison. Liaison adalah bagian dari peran interpersonal."},
  {m:6,tf:1,q:"Menurut Haris (dalam Pranata, 2011) penggerakan yang dilakukan oleh pimpinan harus berpegang pada beberapa prinsip, salah satu prinsip yang dimaksud yaitu \u2026.",o:["prinsip supervisi dan rentang kendali","prinsip spesialisasi","prinsip harmoni dengan tujuan","prinsip rantai skalar"],k:2,e:"Tiga prinsip menurut Haris: mengarah pada tujuan, harmoni dengan tujuan, dan kesatuan komando."},
  {m:6,tf:1,q:"Dalam memberi perintah seorang atasan tidak bisa seenaknya, tetapi harus memperhitungkan langkah-langkah dan resiko dari setiap langkah yang para atasan itu ambil karena setiap keputusan dan langkah akan memberi pengaruh bagi organisasi. Pernyataan tersebut disampaikan oleh \u2026.",o:["Terry","Dimas dkk","Mandala","Allen"],k:1,e:"Dimas dkk. (2010)."},
  {m:6,tf:2,q:"Komunikasi yang meliputi pembahasan tatap muka, pembicaraan melalui telepon, presentasi formal juga pidato adalah \u2026.",o:["komunikasi langsung","komunikasi satu arah","komunikasi lisan","komunikasi aktif"],k:2,e:"Komunikasi lisan: tatap muka, telepon, presentasi formal, pidato. Komunikasi tertulis: memo, surat, file komputer, dan dokumen tertulis lainnya."},
  {m:6,tf:2,q:"Proses komunikasi sering kali dihambat oleh gangguan (noise), atau hambatan dalam sistem, yang akan menghalangi pemahaman yang sempurna dari pesan. Gangguan bisa berbentuk apa saja yang menghambat komunikasi yang akurat; dering telepon, berpikir hal lain (tidak konsentrasi), kelelahan dan stres. Pernyataan tersebut disampaikan oleh \u2026.",o:["Bateman & Snell","Robbins","Maslow","Douglas Mc Gregor"],k:0,e:"Bateman & Snell (2009)."},
  {m:6,tf:2,q:"Komunikasi ini bisa terjadi di antara orang-orang dalam tim kerja yang sama atau dalam departemen yang berbeda. Sebagai contoh, agen pembelian membahas masalah dengan teknisi produksi dan para kepala departemen bertemu untuk membahas masalah tertentu. Berkomunikasi dengan orang lain di luar perusahaan termasuk analis kredit dari bank atau rekanan perusahaan lain. Komunikasi yang dimaksud yaitu \u2026.",o:["komunikasi ke atas","komunikasi ke bawah","komunikasi horizontal","komunikasi informal"],k:2},
  {m:6,tf:2,q:"Teori motivasi yang paling dikenal yang menyampaikan bahwa pada diri tiap orang terdapat hierarki dari lima kebutuhan yaitu Kebutuhan Fisik, Kebutuhan Keamanan, Kebutuhan Sosial, Kebutuhan Harga Diri dan Kebutuhan Aktualisasi Diri. Teori yang dimaksud yaitu \u2026.",o:["Maslow","Mc Gregor","Higienis Herzberg","Robbins"],k:0,e:"Abraham Maslow adalah psikolog humanistik. Tiga teori motivasi populer: Hierarki Kebutuhan Maslow, Teori X dan Y McGregor, dan teori higienis Herzberg."},
  {m:6,tf:2,q:"Kejelasan arah dan tanggung jawab yang jelas, anggota yang memiliki pengetahuan, adanya SOP yang masuk akal, hubungan antar anggota yang baik, saling berbagi dan hubungan dengan pihak luar yang baik dan ciri-ciri lainnya. Merupakan ciri-ciri dari \u2026.",o:["komunikasi yang efektif","tim yang efektif","bekerja yang efektif","penggerakan yang efektif"],k:1},
  {m:6,tf:"LT",q:"Komunikasi (communication) adalah perpindahan informasi dan arti dari satu pihak kepada pihak lain melalui \u2026.",o:["penggunaan simbol bersama","pemberian hadiah","pengawasan langsung","perintah tertulis saja"],k:0},
  {m:6,tf:"LT",q:"Motivasi adalah kesediaan melakukan usaha guna mencapai sasaran organisasi, yang dikondisikan oleh \u2026.",o:["jumlah karyawan","kemampuan usaha tersebut memuaskan kebutuhan sejumlah individu","besarnya gaji pimpinan","luas kantor"],k:1},
  {m:6,tf:"LT",q:"Tiga teori awal motivasi menurut rangkuman adalah \u2026.",o:["Hierarki Kebutuhan Maslow, Teori X dan Y McGregor, dan teori motivasi higienis Herzberg","Teori sistem, Teori kontingensi, dan TQM","Teori klasik, teori perilaku, dan teori ilmu manajemen","Teori Terry, Teori Fayol, dan Teori Mintzberg"],k:0},
  {m:6,tf:"LT",q:"Menurut teori Herzberg, lawan dari kepuasan adalah \u2026.",o:["ketidakpuasan","tidak ada kepuasan","motivasi rendah","kebutuhan fisik"],k:1,e:"Herzberg memakai kontinum ganda: lawan kepuasan adalah tidak ada kepuasan, dan lawan ketidakpuasan adalah tidak ada ketidakpuasan."},
  {m:6,tf:"LT",q:"Tim kerja formal adalah kelompok yang terdiri dari individu-individu yang \u2026.",o:["saling tergantung dan bertanggung jawab atas tercapainya sasaran","bekerja sendiri-sendiri","dipilih hanya oleh pimpinan","bertemu secara informal saja"],k:0,e:"Tim kerja memberikan sinergi positif, upaya kerja sama dan koordinasi lebih baik daripada bekerja sendiri-sendiri."},
  {m:6,tf:"LT",q:"Menurut Maslow, kebutuhan aktualisasi diri adalah \u2026.",o:["makanan, minuman, tempat tinggal","keamanan dan perlindungan dari gangguan fisik dan emosi","kasih sayang dan diterima teman-teman","pertumbuhan, pencapaian potensi, dan pemenuhan diri sendiri"],k:3,e:"Urutan Maslow: fisik, keamanan, sosial, harga diri, aktualisasi diri."},
  {m:6,tf:"LT",q:"Kebutuhan keamanan menurut Maslow berkaitan dengan \u2026.",o:["kasih sayang","keamanan dan perlindungan dari gangguan fisik dan emosi","status dan pengakuan","pertumbuhan potensi"],k:1},
  {m:6,tf:"LT",q:"Berikut ini yang bukan konsep yang berkaitan dengan teknik penggerakan adalah \u2026.",o:["commanding","directing","stimulating","budgeting"],k:3,e:"Konsep penggerakan: commanding, directing, communicating, stimulating, coordinating, dan leading."},

  {m:6,tf:"LT",q:"Berikut ini yang bukan prinsip penggerakan menurut Haris (dalam Pranata, 2011) adalah \u2026.",o:["prinsip mengarah pada tujuan","prinsip harmoni dengan tujuan","prinsip kesatuan komando","prinsip rantai skalar"],k:3},
  {m:7,tf:1,q:"Pengawasan atau pengendalian adalah proses pengaturan yang sistematis dari aktivitas organisasional untuk menjadikan mereka konsisten dengan harapan-harapan yang dibentuk dalam rencana, target dan standar kinerja. Pernyataan tersebut disampaikan oleh \u2026.",o:["Daft","Reeves dan Woodward","Terry","Mandala"],k:0,e:"Daft (2003:525)."},
  {m:7,tf:1,q:"Pengawasan dalam konteksnya lebih ditekankan pada upaya untuk menjamin suatu pekerjaan dilakukan sesuai dengan prosedur standar, rencana dan anggaran namun pengawasan tidak terlibat secara langsung pada \u2026.",o:["perencanaan","proses pekerjaan","pelaksanaan pekerjaan","evaluasi pekerjaan"],k:1},
  {m:7,tf:1,q:"Untuk melakukan secara preventif agar tidak terjadi penyimpangan atau penyelewengan atau secara kuratif yaitu berupa tindakan yang dilakukan agar penyimpangan atau penyelewengan dapat dicegah atau dihentikan sebelum bertambah buruk merupakan \u2026.",o:["tujuan evaluasi","fungsi evaluasi","tujuan dari pengawasan atau pengendalian","fungsi pengawasan atau pengendalian"],k:2,e:"Ini tujuan pengawasan. Fungsi pengawasan (soal berikutnya) adalah memaksimalkan penggunaan sumber daya yang langka agar perilaku pegawai sepenuhnya mengarah pada kepentingan organisasi."},
  {m:7,tf:1,q:"\u2026 dalam organisasi selalu dikaitkan dengan bagaimana memaksimalkan penggunaan sumber daya yang langka untuk terciptanya kondisi perilaku pegawai yang sepenuhnya mengarah kepada kepentingan organisasi.",o:["tujuan evaluasi","fungsi evaluasi","tujuan dari pengawasan atau pengendalian","fungsi pengawasan atau pengendalian"],k:3},
  {m:7,tf:1,q:"Prinsip ini adalah salah satu prinsip dari pengawasan yang menekankan bahwa identifikasi atas kemungkinan potensi atau kejadian penyimpangan harus diawasi atau dikontrol sedini mungkin dengan allowing tindakan perbaikan dalam upaya terjaminnya pencapaian sasaran organisasi. Prinsip yang dimaksud yaitu \u2026.",o:["prinsip afirmasi sasaran","prinsip tanggung jawab pengawasan","prinsip efisiensi","prinsip apropriasi pengawasan"],k:0,e:"Prinsip afirmasi sasaran."},
  {m:7,tf:3,q:"Ada beberapa alasan mengapa pengawasan stratejik penting untuk diterapkan. Salah satunya yaitu \u2026.",o:["sifat dari post-action dari sebagian besar sistem pengawasan seperti anggaran akan menjadi masalah manakala asumsi-asumsi perencanaan berubah dengan cepat dan tidak dapat diramalkan. Pada situasi dunia yang berubah cepat hampir-hampir setiap hari termasuk teknologi, aliansi, dan batas-batas negara yang dinamis, maka perusahaan yang harus berpegangan pada asumsi bahwa premis strateginya akan bergeser, bahkan secara dramatis","dalam dunia yang berubah dengan cepat, pimpinan membutuhkan metode pemantauan seketika (real-time) baik untuk kebutuhan produktivitas yang telah dicanangkan, sebagaimana asumsi yang mendasari pembuatan strateginya","dalam asumsi pengawasan, setiap penyimpangan dari rencana adalah suatu yang buruk atau jelek","harus mendasarkan pada premis atau asumsi-asumsi yang menjadi landasan perencanaan itu sendiri"],k:0,e:"Tiga alasan: (1) sifat post-action sistem pengawasan, (2) dunia berubah cepat sehingga butuh pemantauan real-time, (3) dalam pengawasan tradisional penyimpangan dianggap buruk."},
  {m:7,tf:3,q:"Pengawasan stratejik menurut (1995:31) didefinisikan sebagai “the critical evaluation of plans, activities, and results, (as well as the basic premises underlying them).” Definisi pengawasan stratejik di atas disampaikan oleh \u2026.",o:["Bateman & Snell","Robbins","Dessler","Douglas Mc Gregor"],k:2,e:"Dessler (1995:31)."},
  {m:7,tf:3,q:"Sistem pengawasan feed forward didasarkan pada hal-hal bahwa \u2026.",o:["pengawasan didesain untuk memonitor keseluruhan kejadian atau peristiwa di dalam perusahaan","pengawasan didesain untuk memonitor keseluruhan kejadian atau peristiwa di luar perusahaan","pengawasan sistem ini penting karena perubahan lingkungan yang tidak linier atau dikenal diskontinu","pengawasan sistem ini penting karena perubahan lingkungan yang linier atau dikenal kontinu"],k:2},
  {m:7,tf:3,q:"Sedikit berbeda dengan metode lainnya yang memusatkan pada identifikasi asumsi-asumsi secara lebih dini, di mana perencanaan stratejik telah dibuat, pengawasan ini bersandar kepada pemindaian lingkungan. Metode yang dimaksud yaitu \u2026.",o:["metode premis","metode survailans","metode khusus siaga","metode feed forward"],k:1,e:"Metode survailans: pengendalian lingkungan sebagai upaya mengidentifikasi lebih dini kejadian-kejadian kritis yang tak teridentifikasi sebelumnya."},
  {m:7,tf:3,q:"Beberapa kemungkinan konsekuensi dan reaksi pegawai terhadap pengawasan, apalagi kalau pengawasan tersebut dilakukan secara berlebihan, akan menghasilkan sesuatu yang tidak sesuai dengan tujuan dari pengawasan itu sendiri. Reaksi yang tidak diinginkan bahkan reaksi-reaksi yang membahayakan organisasi antara lain sebagai berikut, kecuali \u2026.",o:["sikap negatif","mempermainkan","perilaku tidak sesuai","integritas"],k:3,e:"Reaksi tidak diinginkan: perilaku tak sesuai (behavioral displacement), mempermainkan (gamesmanship), menunda pekerjaan operasional, dan sikap negatif."},
  {m:7,tf:"LT",q:"Pengawasan dibagi dalam dua kategori, yaitu \u2026.",o:["pengawasan regulatif dan pengawasan normatif","pengawasan preventif dan kuratif","pengawasan internal dan eksternal","pengawasan feedforward dan feedback"],k:0},
  {m:7,tf:"LT",q:"Berikut ini yang bukan tipe pengawasan regulatif adalah \u2026.",o:["pengawasan birokrasi","pengawasan finansial","pengawasan kualitas","pengawasan norma kelompok"],k:3,e:"Regulatif: birokrasi, finansial, kualitas. Normatif: norma kelompok dan norma budaya organisasi."},

  {m:7,tf:2,q:"Pengawasan ini berasal dan berada pada garis-garis kewenangan dan kewenangan ini berasal dari salah satu posisi dalam hierarki organisasi. Semakin tinggi rantai komando, semakin banyak kewenangan yang dimiliki untuk mendikte (menetapkan) kebijakan dan prosedur. Pengawasan yang dimaksud yaitu \u2026.",o:["pengawasan birokratis","pengawasan keuangan","pengawasan norma kelompok","pengawasan norma budaya organisasi"],k:0},

  {m:8,tf:1,q:"Jabatan-jabatan yang termasuk di dalamnya adalah para Kepala Divisi, General Manager, para Manajer Fungsional (Keuangan, Sumber daya Manusia, dan lain). Termasuk juga Kepala Departemen, Manajer Lini Produksi (menangani satu jenis produk), serta manajer lainnya termasuk pada \u2026.",o:["level tingkat atas","level tingkat menengah","level tingkat bawah","level jabatan operasional"],k:1,e:"CEK: kunci buku tertulis A, tapi penjelasannya di buku menyebut level menengah, yaitu pilihan B. App memakai B. Kalau tutor bilang lain, kabari."},
  {m:8,tf:1,q:"Peran ASN menunjukkan level-level mana posisi ASN tersebut berada. Peran sebagai pengawas menunjukkan pada \u2026.",o:["level paling bawah","level menengah","level tertinggi atas","level pelaksana"],k:3,e:"CEK: kunci buku D. Teks penjelasan di kunci buku untuk nomor ini tidak jelas (tercampur), jadi tidak bisa diverifikasi."},
  {m:8,tf:1,q:"Pimpinan yang memiliki peran dan tanggung jawab mengelola satuan-satuan bisnis atau kalau dalam internal perusahaan mengelola bagian atau departemen utama yaitu pimpinan \u2026.",o:["tingkat atas","tingkat menengah","tingkat bawah","tingkat pelaksana"],k:1,e:"CEK: kunci buku tertulis A, tapi penjelasannya menyebut tingkat menengah (middle management), yaitu pilihan B. App memakai B."},
  {m:8,tf:1,q:"Secara umum aktivitas kegiatan para pimpinan pada tingkat ini adalah Menetapkan dan menentukan penugasan pekerjaan dan tugas-tugas yang harus dikerjakan kepada para pegawai \u2026.",o:["tingkat atas","tingkat menengah","tingkat bawah","tingkat pelaksana"],k:2,e:"CEK: kunci buku tertulis A, tapi penjelasannya menyebut pimpinan tingkat bawah, yaitu pilihan C. App memakai C."},
  {m:8,tf:2,q:"Secara umum ada 3 keterampilan manajerial yang dikenal pada perusahaan, salah satunya yaitu \u2026.",o:["keterampilan teknis.","keterampilan diagnostik","keterampilan politik","keterampilan sosial kultural"],k:0,e:"Kunci buku A. Tiga keterampilan manajerial: teknis, interpersonal, dan politik. Catatan: penjelasan di kunci buku nomor 1 dan 2 tercampur (salinan TF1), tapi hurufnya A dan B."},
  {m:8,tf:2,q:"Keterampilan interpersonal (sering juga disebut keterampilan hubungan antar manusia), merupakan suatu kemampuan untuk bisa bekerja (sama) dengan orang lain, baik sebagai pimpinan maupun sebagai anggota tim \u2026.",o:["keterampilan teknis","keterampilan interpersonal","keterampilan diagnostik","keterampilan politik"],k:1},
  {m:8,tf:2,q:"Keterampilan ini dalam arti positif digunakan oleh pimpinan dengan cara memanfaatkan kekuasaan dan kewenangan yang ada pada dirinya untuk mencapai tujuan organisasi. Keterampilan yang dimaksud adalah \u2026.",o:["keterampilan teknis","keterampilan interpersonal","keterampilan diagnostik","keterampilan politik"],k:3},
  {m:8,tf:2,q:"Ada 3 kompetensi sebagaimana dirumuskan dalam Manajemen ASN yaitu Kompetensi Teknis, Kompetensi Manajerial dan Kompetensi Kultural. Di bawah ini adalah penjelasan mengenai kompetensi manajerial \u2026.",o:["pengetahuan, keterampilan, dan sikap/perilaku yang dapat diamati, diukur, dan dikembangkan yang spesifik berkaitan dengan bidang teknis jabatan","pengetahuan, keterampilan, dan sikap/perilaku yang dapat diamati, diukur, dikembangkan untuk memimpin dan/atau mengelola unit organisasi","pengetahuan, keterampilan, dan sikap/perilaku yang dapat diamati, diukur, dan dikembangkan terkait dengan pengalaman berinteraksi dengan masyarakat majemuk dalam hal agama, suku dan budaya, perilaku, wawasan kebangsaan, etika, nilai-nilai, moral, emosi dan prinsip, yang harus dipenuhi oleh setiap pemegang Jabatan untuk memperoleh hasil kerja sesuai dengan peran, fungsi dan Jabatan","pengetahuan, kemampuan untuk memahami dan menguasai dengan baik metoda, peralatan, teknik pekerjaan yang digunakan untuk melaksanakan tugas tertentu"],k:1,e:"A = kompetensi teknis, B = manajerial, C = sosial kultural."},
  {m:8,tf:2,q:"Manning, Curtis dan McMillen (1996) mengemukakan bahwa ada empat gaya hubungan antar manusia, sebagai basis dalam hubungan interpersonal yang dengan istilah lain (oleh Manning dkk.) disebut juga “region of the unknown”. Gaya hubungan antar manusia yang dimaksud adalah \u2026.",o:["turtle: low trust/respect","owl: high respect/low trust","bull-in a china shop: high trust/low respect","picture window – high trust/high respect"],k:0},
  {m:8,tf:3,q:"Terdapat 3 peran manajerial yang terpenting yaitu \u2026.",o:["peran pengambilan keputusan, peran fungsional, peran hubungan antar pribadi","peran pengambilan keputusan, peran informasional, peran hubungan antar pribadi","peran pengambilan keputusan, peran penggerakan, peran pengawasan","peran pengambilan keputusan, peran penggerakan, peran evaluator"],k:1},
  {m:8,tf:3,q:"Peran pengambilan keputusan antara lain dilakukan oleh pimpinan dalam bentuk membuat perencanaan strategis dan peran dalam penggunaan sumber daya. Peran pengambilan keputusan ini adalah yang dilakukan oleh pimpinan untuk menghadapi berbagai permasalahan yang muncul, yang tak terduga sebelumnya baik berasal dari lingkungan internal maupun eksternal organisasi. Peran ini dilakukan oleh semua level pimpinan mulai dari pimpinan tingkat atas sampai dengan pimpinan tingkat bawah sesuai dengan sifat, hakikat, bentuk dan lingkup gangguan itu sendiri. Peran pengambilan keputusan yang dimaksud adalah \u2026.",o:["peran entrepreneur","peran disturbance handler","peran resource allocator","peran negotiator"],k:1},
  {m:8,tf:3,q:"Peran ini merupakan salah satu peran pemimpin dalam pengambilan keputusan yang berkaitan dengan hubungan pekerjaan dengan pihak lain, seperti pemasok, distributor, serikat pekerja, dalam rangka mencapai kesepakatan berkaitan dengan produk, jasa-jasa, maupun kesepakatan perjanjian kerja. Peran pengambilan keputusan yang dimaksud adalah \u2026.",o:["peran entrepreneur","peran disturbance handler","peran resource allocator","peran negotiator"],k:3},
  {m:8,tf:3,q:"Peran interpersonal menuntut pimpinan untuk mengarahkan dan menyupervisi para pekerja dan organisasi. Salah satu peran interpersonal yang dimainkan dalam bentuk tindakan-tindakan dan contoh nyata bagi seluruh pekerja untuk diikuti, memberikan komando dan pengarahan kepada para bawahan, membuat keputusan dan mobilisasi dukungan pekerja adalah \u2026.",o:["peran entrepreneur","peran leader","peran liaison","peran figurehead"],k:1},
  {m:8,tf:3,q:"Berikut ini adalah 3 peran khusus terkait dengan peran informasional, kecuali \u2026.",o:["peran monitor","peran spokesperson","peran disseminator","peran negotiator"],k:3,e:"Informasional: monitor, spokesperson, disseminator. Negotiator termasuk peran pengambilan keputusan."},
  {m:8,tf:"LT",q:"Koontz menyatakan “management is what manager does”. Artinya manajemen adalah \u2026.",o:["apa yang dikerjakan oleh pimpinan","apa yang dikerjakan karyawan","apa yang direncanakan pemerintah","apa yang diawasi pelanggan"],k:0},
  {m:8,tf:"LT",q:"Tiga peran manajerial yang terpenting adalah peran pengambilan keputusan, peran informasional, dan \u2026.",o:["peran hubungan antar pribadi","peran pengawasan","peran penggerakan","peran evaluator"],k:0},

  {m:8,tf:"LT",q:"Tiga peran khusus dalam peran interpersonal adalah \u2026.",o:["figurehead, leader, liaison","monitor, disseminator, spokesperson","entrepreneur, negotiator, leader","liaison, monitor, resource allocator"],k:0},

  {m:8,tf:"LT",q:"Pimpinan tingkat menengah (middle management) memiliki peran dan tanggung jawab \u2026.",o:["mengelola satuan-satuan bisnis atau bagian atau departemen utama","menetapkan visi perusahaan saja","mengerjakan pekerjaan operasional harian","hanya mengawasi satpam"],k:0},

  {m:9,tf:1,q:"Menurut Berger, manajemen perubahan pada dasarnya adalah \u2026.",o:["suatu proses yang berkelanjutan yang dilakukan oleh organisasi dengan cara menyelaraskan organisasi dengan pelanggan di mana organisasi itu beroperasi","suatu proses yang berkelanjutan yang dilakukan oleh organisasi dengan cara menyelaraskan organisasi dengan lingkungan di mana organisasi itu beroperasi","suatu proses yang berkelanjutan yang dilakukan oleh organisasi dengan cara menyelaraskan organisasi dengan pasar di mana organisasi itu beroperasi","suatu proses yang berkelanjutan yang dilakukan oleh organisasi dengan cara menyelaraskan organisasi dengan pasar di mana organisasi itu beroperasi dan bagaimana aliansi tersebut dapat mendorong organisasi menjadi lebih tanggap dan efektif dibanding dengan pesaing"],k:3,e:"Pilihan D yang paling lengkap karena menyebut aliansi dan keunggulan dibanding pesaing."},
  {m:9,tf:1,q:"Meskipun proses manajemen perubahan setiap organisasi atau perusahaan berbeda-beda, terdapat sistem konsep-konsep dan elemen-elemen manajemen perubahan yang bersifat generik, di antaranya yaitu \u2026.",o:["perusahaan atau organisasi harus memahami kenyataan bahwa perubahan terjadi di setiap saat","perubahan apapun yang diadopsi dalam perusahaan, kesemuanya harus di eksekusi dengan 2 kunci pengungkit yaitu: strategi, dan operasi","sistem yang dibuat, jangan sampai memberikan peluang sikap “hal itu tak akan terjadi pada kita” yang dapat menipu atau membuat terlena, sehingga pada akhirnya harus membayar kerugian akibat kelalaian dengan sikap tersebut","segera sesudah titik-titik pemicu perubahan mulai terlihat, organisasi atau perusahaan harus sudah memiliki visi yang jelas"],k:2,e:"Elemen generik manajemen perubahan di buku: (1) menyadari perubahan terjadi terus menerus, (2) ada sistem untuk mendeteksi pemicu perubahan, (3) jangan bersikap hal itu tak akan terjadi pada kita, (4) segera memiliki program yang jelas untuk menanganinya, (5) eksekusi dengan empat kunci pengungkit: strategi, operasi, budaya, dan sistem kompensasi."},
  {m:9,tf:1,q:"Jika dilihat dari gradasi atau tingkatan perubahan, terdapat 4 tipe perubahan. Salah satu tipe perubahan ini terjadi pada suatu perusahaan pada suatu industri atau kelompok usaha tertentu menjadi bagian dari perusahaan atau bergabung dengan perusahaan lain. Tipe perubahan yang dimaksud adalah \u2026.",o:["perubahan geometrik","perubahan linier","perubahan kuantum","perubahan metamorfosis"],k:0},
  {m:9,tf:1,q:"Salah satu tipe perubahan lainnya di mana suatu perusahaan atau organisasi berubah secara total dengan meninggalkan usaha yang selama ini digeluti sejak awal ke bentuk perusahaan yang sama sekali baru. Tipe perubahan yang dimaksud adalah \u2026.",o:["perubahan geometrik","perubahan linier","perubahan kuantum","perubahan metamorfosis"],k:3},
  {m:9,tf:1,q:"Salah satu ciri generasi kedua: manajemen personalia dalam perkembangan pengelolaan sumber daya manusia yaitu \u2026.",o:["ditandai dengan model pengelolaan manusia sebagai faktor produksi, bahkan dianggap sebagai mesin. Hubungan antar pimpinan sekaligus pemilik perusahaan masih bersifat informal","diawali dengan munculnya konflik antara majikan dan buruh. Buruh tidak lagi rela diperlakukan sebagai mesin semata-mata, tetapi mesin yang memiliki perasaan (neurophysiological-machine), yang tidak dapat diperlakukan seenaknya","perubahan pandangan terhadap manusia bukan lagi sebagai faktor produksi, tetapi sebagai sumber daya perusahaan dengan perlakuan khusus","pimpinan yang mengelola SDM yang sudah sejajar dengan pimpinan lainnya beralih posisi dari sebelah kiri ke sebelah kanan pimpinan utama perusahaan. Dengan kata lain pimpinan pengelola SDM menjadi sandaran utama bagi pimpinan utama perusahaan dalam mengambil keputusan"],k:1},
  {m:9,tf:2,q:"Kepemimpinan merupakan salah satu fungsi manajemen. Kepemimpinan adalah usaha untuk mempengaruhi orang lain agar orang tersebut mau bergerak atau bekerja, melakukan sesuatu, bahkan tidak melakukan sesuatu sesuai dengan yang dikehendaki oleh pimpinan \u2026.",o:["arti kepemimpinan","hakikat kepemimpinan","peran kepemimpinan","fungsi kepemimpinan"],k:1},
  {m:9,tf:2,q:"Pemimpin tipe ini atau sifat kepemimpinan yang memiliki ciri apa yang dikatakannya menjadi sumber inspirasi dan menjadi sumber motivasi adalah \u2026.",o:["strong man","the transactor","visionary hero","kepemimpinan super"],k:2,e:"Sumber inspirasi mengacu pada sifat visioner. Sumber motivasi mengacu pada ketaatan para bawahan atau anggota organisasi."},
  {m:9,tf:2,q:"Salah satu peran yang dapat dimainkan oleh seorang pemimpin dengan karakteristik kepemimpinan super yaitu pemimpin harus mampu menarik, mengembangkan dan mempertahankan talent terbaik dalam organisasi, membangun dan memfasilitasi budaya yang mendorong pengembangan. Peran yang dimaksud yaitu pemimpin sebagai \u2026.",o:["kapten","dokter","eksekutor","pelatih (coach) dan pembimbing (counselor)"],k:3},
  {m:9,tf:2,q:"Pendekatan dalam mendengarkan secara aktif dapat dilakukan dengan menggunakan konsep interrupt yaitu \u2026.",o:["dilakukan dengan menunjukkan kepedulian, memandang dengan seksama ke arah pembicara, anggukan kepala dan \u2026. dengan kata oh ya dan lain-lain tidak memotong pembicaraan, biarkan mengungkapkan dengan bebas, nyaman pemikiran dan ide-idenya","dilakukan dengan maksud mengarahkan pembicaraan, bukan memotong, dari laporan umum ke hal-hal yang sifatnya spesifik yang sedang menjadi trending topic pada sektor atau bagian tugas bawahan yang memberikan laporan atau sedang menyampaikan gagasan lainnya","dilakukan dengan cara memberikan dukungan pada permasalahan yang sedang dicari pemecahannya mulai dari latar belakang, fakta, dan menurut pendapat serta solusi yang diusulkannya. Dukungan diberikan dalam bentuk alternatif perbaikan yang disampaikan kepada bawahan, sekaligus sebagai bentuk ketidaksetujuan atas cara-cara yang ditempuh bawahan. Secara tidak sadar bawahan tidak merasa dipersalahkan, meskipun salah","merupakan bentuk lain dari dukungan dengan berada di belakang bawahan yang menghadapi kesulitan atau masalah yang harus dipecahkan pada bagian atau sektornya. Hal ini dilakukan dengan mengetahui dan memahami situasinya"],k:1,e:"A = response, B = interrupt, C = support, D = empathy."},
  {m:9,tf:2,q:"Cara atau tips, tentang bagaimana bahasa dan dialog percakapan yang dapat digunakan untuk meningkatkan peran anggota atau pengikut mampu memimpin diri sendiri yaitu dengan cara \u2026.",o:["mengurangi penggunaan bahasa yang menekankan pada pengarahan, instruksi, dan komando","lebih banyak memberi arahan teknis","penetapan tujuan-tujuan berdasarkan penugasan dengan jelas","tidak mengubah atau mengganti keputusan yang telah diambil bawahan"],k:0},
  {m:9,tf:3,q:"Manajemen matriks merupakan salah satu bentuk pekerjaan multi agen yang khas hanya ditemukan pada \u2026.",o:["organisasi tunggal","organisasi multi","organisasi kecil","organisasi besar"],k:0,e:"Manajemen matriks khas ditemukan di dalam organisasi tunggal."},
  {m:9,tf:3,q:"Bentuk organisasi yang mengacu kepada suatu situasi di mana berbagai pihak dilibatkan atau terlibat tidak hanya dalam perencanaan atau perumusan strategi, tetapi juga dalam implementasi dan tindakan yang sesuai atau mengikuti keputusan, yang secara esensial menjadi tugas masing-masing pihak yang bekerja secara bersama-sama adalah \u2026.",o:["perencanaan bersama","joint working","pengelolaan bersama","jejaring"],k:1},
  {m:9,tf:3,q:"Bentuk organisasi yang digunakan untuk merangkum variasi berbagai keadaan, mulai dari mitra-pasangan dekat dalam organisasi sampai kepada bentuk ikatan dari organisasi yang berbeda adalah \u2026.",o:["perencanaan bersama","joint working","pengelolaan bersama","jejaring"],k:3,e:"Jejaring: istilah yang merangkum variasi keadaan dari mitra dekat dalam organisasi sampai ikatan antar organisasi yang berbeda."},

 const st=Object.keys(H2.stats||{});
 if(st.length){h+=`<div class="card"><b>Statistik per materi</b><div style="margin-top:6px">`+st.map(k=>{const x=H2.stats[k];const p=Math.round(100*x.b/x.t);return `<div class="stat"><span>${k}</span><span>${p}% benar <small style="color:var(--mute)">(${x.b}/${x.t})</small></span></div>`}).join("")+`</div>
 <div class="row"><button class="btn ghost" onclick="resetH()">${S.arm?"Yakin hapus semua? Klik sekali lagi":"Reset riwayat"}</button></div></div>`}
 app.innerHTML=h;
}
function resetH(){if(!S.arm){S.arm=true;home();return}S.arm=false;H[S.mk]={stats:{},wrong:[]};save();home()}
function tg(k){S.arm=false;S.msg="";S.mods.has(k)?S.mods.delete(k):S.mods.add(k);home()}
function start(){S.msg="";S.arm=false;
 const mk=S.mk;let l=BANK[mk].soal.filter(s=>!S.mods.size||S.mods.has(label(s)));
 if(S.wrongOnly){const w=new Set((H[mk]||{}).wrong||[]);l=l.filter(s=>w.has(key(mk,s)))}
 if(!l.length){S.msg="Belum ada soal untuk pilihan ini.";home();return}
 l=l.slice();if(S.shuffle)for(let i=l.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[l[i],l[j]]=[l[j],l[i]]}
 S.list=l;S.i=0;S.ans=null;S.score=0;S.wrong=[];H[mk]=H[mk]||{stats:{},wrong:[]};quiz();
}
function quiz(){
 const s=S.list[S.i],n=S.list.length,done=S.ans!==null;
 let h=`<div class="top"><span>Soal ${S.i+1} dari ${n}</span><span>Benar: ${S.score}</span></div><div class="bar"><i style="width:${100*S.i/n}%"></i></div>
 <div class="card"><span class="badge">${label(s)}</span><p class="q">${esc(s.q)}</p>`;
 s.o.forEach((t,i)=>{let c="";if(done){if(i===s.k)c="ok";else if(i===S.ans)c="bad"}
  h+=`<button class="opt ${c}" ${done?"disabled":""} onclick="pick(${i})"><b>${L[i]}.</b><span>${esc(t)}</span></button>`});
 if(done){const ok=S.ans===s.k;h+=`<div class="fb" style="color:var(--${ok?"ok":"bad"})">${ok?"Benar!":"Salah. Jawaban yang benar: "+L[s.k]+". "+esc(s.o[s.k])}</div>${s.e?`<div style="margin-top:8px;color:var(--mute);font-size:14px">${esc(s.e)}</div>`:""}
 <div class="row"><button class="btn" onclick="next()">${S.i+1<n?"Soal berikutnya":"Lihat skor"}</button></div>`}
 h+=`</div><button class="btn ghost" onclick="home()">Keluar</button>`;
 app.innerHTML=h;
}
function pick(i){
 if(S.ans!==null)return;S.ans=i;const s=S.list[S.i],mk=S.mk,d=H[mk],k=key(mk,s),lb=label(s);
 d.stats[lb]=d.stats[lb]||{b:0,t:0};d.stats[lb].t++;
 if(i===s.k){S.score++;d.stats[lb].b++;d.wrong=d.wrong.filter(x=>x!==k)}
 else{S.wrong.push({s,i});if(!d.wrong.includes(k))d.wrong.push(k)}
 save();quiz();
}
function next(){S.i++;S.ans=null;S.i<S.list.length?quiz():result()}
function result(){
 const n=S.list.length,p=Math.round(100*S.score/n);
 const lv=p>=90?"Baik sekali":p>=80?"Baik":p>=70?"Cukup":"Kurang";
 let h=`<div class="card" style="text-align:center"><div style="color:var(--mute)">Skor kamu</div><div class="big">${p}%</div><div>${S.score} benar dari ${n} soal \u00B7 ${lv}</div>
 <p style="color:var(--mute);font-size:14px;margin-bottom:0">Patokan UT: 80% ke atas boleh lanjut materi berikutnya.</p></div>`;
 if(S.wrong.length){h+=`<div class="card"><b>Yang salah</b>`+S.wrong.map(w=>`<div class="wrongItem"><span class="badge">${label(w.s)}</span><div>${esc(w.s.q)}</div><div style="color:var(--bad)">Jawabanmu: ${L[w.i]}. ${esc(w.s.o[w.i])}</div><div style="color:var(--ok)">Benar: ${L[w.s.k]}. ${esc(w.s.o[w.s.k])}</div></div>`).join("")+`</div>`}
 h+=`<div class="row"><button class="btn" onclick="start()">Ulangi</button><button class="btn ghost" onclick="home()">Menu utama</button></div>`;
 app.innerHTML=h;
}
home();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
</body>
</html>
